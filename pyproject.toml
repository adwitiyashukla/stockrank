[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockrank"
version = "0.1.0"
description = "Cross-sectional equity return forecasting and portfolio construction with leakage-safe validation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adwitiya Shukla" }]
keywords = ["quantitative-finance", "machine-learning", "backtesting", "portfolio-optimization", "fintech"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "lightgbm>=4.0",
    "arch>=6.2",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "typer>=0.9",
    "joblib>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
deep = ["torch>=2.0"]
explain = ["shap>=0.44"]
market = ["yfinance>=0.2.40", "pandas-datareader>=0.10"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
app = ["streamlit>=1.49", "plotly>=5.19"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "mypy>=1.8", "httpx>=0.27"]
all = [
    "torch>=2.0", "shap>=0.44", "yfinance>=0.2.40", "pandas-datareader>=0.10",
    "fastapi>=0.110", "uvicorn[standard]>=0.27", "streamlit>=1.49", "plotly>=5.19",
    "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "httpx>=0.27",
]

[project.scripts]
stockrank = "stockrank.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long running tests", "torch: requires pytorch"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
