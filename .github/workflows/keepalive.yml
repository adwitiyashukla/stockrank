name: Keepalive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping the Hugging Face Space
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPACE_ID: adwitiyashukla/stockrank
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      UA: "stockrank-keepalive/1.0 (+https://github.com/adwitiyashukla/stockrank)"
    steps:
      - name: Wake the Space and wait until it reports RUNNING
        run: |
          set -uo pipefail

          api="https://huggingface.co/api/spaces/${SPACE_ID}"

          fetch_api() {
            if [ -n "${HF_TOKEN:-}" ]; then
              curl -sS -L --max-time 30 \
                -H "User-Agent: ${UA}" \
                -H "Accept: application/json" \
                -H "Authorization: Bearer ${HF_TOKEN}" \
                -w '\n%{http_code}' "$api"
            else
              curl -sS -L --max-time 30 \
                -H "User-Agent: ${UA}" \
                -H "Accept: application/json" \
                -w '\n%{http_code}' "$api"
            fi
          }

          resp=$(fetch_api)
          code=$(printf '%s' "$resp" | tail -n 1)
          body=$(printf '%s' "$resp" | sed '$d')

          if [ "$code" != "200" ]; then
            echo "::error::Hub API returned HTTP ${code} for ${SPACE_ID}"
            echo "First 500 bytes of the response:"
            printf '%s\n' "$body" | head -c 500
            exit 1
          fi

          host=$(printf '%s' "$body" | jq -r '
            if .host then .host
            elif (.runtime.domains[0].domain // "") != "" then "https://" + .runtime.domains[0].domain
            else "" end' 2>/dev/null)

          if [ -z "$host" ] || [ "$host" = "null" ]; then
            echo "::error::Could not resolve a URL for ${SPACE_ID}."
            echo "HTTP ${code}. First 500 bytes of the response:"
            printf '%s\n' "$body" | head -c 500
            exit 1
          fi
          echo "Space URL: ${host}"

          for attempt in $(seq 1 20); do
            curl -sS -L -o /dev/null --max-time 30 -H "User-Agent: ${UA}" "$host" || true

            resp=$(fetch_api)
            code=$(printf '%s' "$resp" | tail -n 1)
            body=$(printf '%s' "$resp" | sed '$d')
            stage=$(printf '%s' "$body" | jq -r '.runtime.stage // "UNKNOWN"' 2>/dev/null)
            [ -z "$stage" ] && stage="UNKNOWN"
            echo "Attempt ${attempt}: http=${code} stage=${stage}"

            case "$stage" in
              RUNNING|RUNNING_BUILDING)
                {
                  echo "### Space is awake"
                  echo ""
                  echo "\`${SPACE_ID}\` reported \`${stage}\` after ${attempt} attempt(s)."
                  echo ""
                  echo "${host}"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              PAUSED|BUILD_ERROR|RUNTIME_ERROR|CONFIG_ERROR)
                echo "::error::${SPACE_ID} is in state ${stage}. Pinging cannot fix this."
                {
                  echo "### Space needs attention"
                  echo ""
                  echo "State: \`${stage}\`"
                  echo ""
                  echo "Check the logs at https://huggingface.co/spaces/${SPACE_ID}"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac

            sleep 20
          done

          echo "::error::${SPACE_ID} did not reach RUNNING within about seven minutes."
          echo "Last response, first 500 bytes:"
          printf '%s\n' "$body" | head -c 500
          exit 1
