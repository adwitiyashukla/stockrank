name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,explain,api]"

      - name: Lint
        run: ruff check src tests dashboard scripts

      - name: Test (fast)
        run: pytest -q -m "not slow" --cov=stockrank --cov-report=term-missing

      - name: Leakage control experiments
        run: pytest -q -m slow

      - name: Smoke test the pipeline end to end
        run: python -m stockrank.cli run --config configs/signal_recovery.yaml --smoke

      - name: Check the CLI entrypoints
        run: |
          python -m stockrank.cli models
          python -m stockrank.cli list-runs
